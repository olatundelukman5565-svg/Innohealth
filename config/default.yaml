# Innohealth ThermalMesh Pipeline - default configuration.
# Every important parameter is here rather than hard-coded in source.

mesh:
  simplify: false
  target_faces: null

registration:
  method: auto          # auto | centroid | pca | icp | none
  max_iterations: 100
  convergence_tolerance: 1.0e-6

camera:
  estimate_pose: true
  refine_pose: true
  use_distortion: true

thermal:
  unit: celsius          # informational; no conversion applied unless calibration is configured
  interpolation: bilinear  # bilinear | nearest
  delimiter: null         # null = auto-detect from extension
  has_header: false

projection:
  occlusion_check: true

uv:
  enabled: true
  resolution: 2048

blending:
  method: weighted
  distance_weight: true
  angle_weight: true
  confidence_weight: true

output:
  glb: true
  gltf: true
  csv: true
  numpy: true
  json: true
  hdf5: true

debug:
  save_diagnostics: true
